<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Recomp Super Pro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recomp">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  body{background:#0f172a;color:#f1f5f9;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;padding-bottom:env(safe-area-inset-bottom)}
  ::-webkit-scrollbar{width:0;height:0}
  input[type=checkbox]{width:1.6rem;height:1.6rem;accent-color:#3b82f6}
  .inp{width:100%;background:#0f172a;border:1px solid #475569;border-radius:.75rem;padding:.75rem;color:#fff;font-size:1rem}
  .inp:focus{outline:none;border-color:#3b82f6}
  .card{background:#1e293b;border:1px solid #334155;border-radius:1rem;padding:1rem}
  .btn{border-radius:.75rem;padding:.8rem 1rem;font-weight:700;transition:transform .1s}
  .btn:active{transform:scale(.97)}
  .bar{height:.5rem;background:#0f172a;border-radius:9999px;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:9999px}
  .carousel{display:flex;gap:.75rem;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:.5rem}
  .carousel>.ex{flex:0 0 92%;scroll-snap-align:center}
  .flip{position:relative;height:13rem;background:#fff;border-radius:.75rem;overflow:hidden}
  .flip img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .flip img.b{animation:flip 1.8s steps(1,end) infinite}
  @keyframes flip{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
  @media print{.noprint{display:none!important}body{background:#fff;color:#000}}
  .toast{animation:up .25s ease-out}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<div id="auth" class="hidden min-h-screen flex items-center justify-center p-6">
  <form id="auth-form" class="card w-full max-w-sm space-y-3">
    <h1 class="text-2xl font-bold text-blue-400 text-center">Recomp Super Pro</h1>
    <p class="text-sm text-slate-300 text-center">Entra una vez. La sesión queda guardada en este dispositivo.</p>
    <input id="auth-email" type="email" autocomplete="email" required placeholder="Correo" class="inp">
    <input id="auth-pass" type="password" autocomplete="current-password" required minlength="6" placeholder="Contraseña" class="inp">
    <button class="btn bg-blue-600 w-full" data-mode="in">Entrar</button>
    <button type="button" id="auth-up" class="text-sm text-blue-300 underline w-full">Crear cuenta (solo la primera vez)</button>
    <p id="auth-msg" class="text-sm text-amber-300 text-center"></p>
  </form>
</div>

<div id="app" class="hidden">
  <header class="bg-slate-800 shadow sticky top-0 z-20 noprint">
    <div class="max-w-3xl mx-auto px-3 pt-3 pb-2">
      <div class="flex items-center justify-between mb-2">
        <h1 class="text-lg font-bold text-blue-400">Mounjaro Recomp</h1>
        <span id="sync" class="text-xs text-slate-400">●</span>
      </div>
      <nav class="grid grid-cols-6 gap-1 text-xs font-semibold" id="tabs">
        <button data-tab="hoy">Hoy</button>
        <button data-tab="comida">Comida</button>
        <button data-tab="fuerza">Fuerza</button>
        <button data-tab="evolucion">Evolución</button>
        <button data-tab="progreso">Progreso</button>
        <button data-tab="ajustes">Ajustes</button>
      </nav>
    </div>
  </header>
  <main id="view" class="max-w-3xl mx-auto p-3 pb-28"></main>
  <div id="rest" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 z-30 bg-blue-600 rounded-full px-5 py-3 font-bold shadow-xl noprint"></div>
  <div id="toasts" class="fixed bottom-20 left-3 right-3 z-40 space-y-2 pointer-events-none noprint"></div>
</div>

<div id="setup" class="hidden p-6 max-w-md mx-auto text-slate-200">
  <h1 class="text-xl font-bold text-amber-300 mb-2">Falta conectar Supabase</h1>
  <p>Edita <code>js/config.js</code> con tu Project URL y tu anon key, haz commit y recarga.</p>
</div>

<input id="file-meal" type="file" accept="image/*" capture="environment" class="hidden">
<input id="file-meal-gal" type="file" accept="image/*" class="hidden">
<input id="file-fit" type="file" accept="image/*" class="hidden">
<input id="file-import" type="file" accept=".json,application/json" class="hidden">

<script type="module" src="js/app.js"></script>
</body>
</html>
